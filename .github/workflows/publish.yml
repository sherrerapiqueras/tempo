name: Publish
run-name: "Publish ${{ github.event.release.tag_name || inputs.tag }}"

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.6.0 or 0.6.0)'
        required: true

permissions:
  contents: read

# Each release goes to open testing on its own, then waits for a reviewer on the
# play-production environment before the same build is promoted to production.
# Concurrency is per job, so a release waiting for that approval doesn't block the
# next one from reaching open testing.

defaults:
  run:
    shell: bash

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: 📦 Build
    runs-on: ubuntu-latest
    permissions:
      contents: write # attaches the APK to the GitHub release
    concurrency:
      group: publish-build
      cancel-in-progress: false
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      version-code: ${{ steps.version-code.outputs.version-code }}
    steps:
      - name: Resolve tag
        id: version
        env:
          RAW: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          VERSION="${RAW#v}"
          if [[ ! "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag '$RAW' is not a MAJOR.MINOR.PATCH version."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.version.outputs.tag }}

      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set. Cannot build a release."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "${{ github.workspace }}/app/release.keystore"
          echo "KEYSTORE_FILE=${{ github.workspace }}/app/release.keystore" >> "$GITHUB_ENV"

      - name: Build release AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      # Production promotes by version code, so take it from what was built rather than
      # re-deriving it from the tag.
      - name: Read version code
        id: version-code
        run: |
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          VERSION_CODE=$("$AAPT2" dump badging app/build/outputs/apk/release/app-release.apk \
            | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
          if [ -z "$VERSION_CODE" ]; then
            echo "::error::Couldn't read the version code from the release APK."
            exit 1
          fi
          echo "version-code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Rename artifacts
        run: |
          VERSION=${{ steps.version.outputs.version }}
          mv app/build/outputs/bundle/release/app-release.aab app/build/outputs/bundle/release/tempo-$VERSION.aab
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/tempo-$VERSION.apk

      - name: Upload release AAB
        uses: actions/upload-artifact@v7
        with:
          name: tempo-${{ steps.version.outputs.version }}.aab
          path: app/build/outputs/bundle/release/tempo-${{ steps.version.outputs.version }}.aab
          retention-days: 90

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: tempo-${{ steps.version.outputs.version }}.apk
          path: app/build/outputs/apk/release/tempo-${{ steps.version.outputs.version }}.apk
          retention-days: 90

      # The APK attached below is minified too; crashes reported from it need this file to read.
      # (The AAB carries its own copy for Play Console.)
      - name: Upload R8 mapping
        uses: actions/upload-artifact@v7
        with:
          name: tempo-${{ steps.version.outputs.version }}-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 90

      - name: Attach APK to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.version.outputs.tag }}" \
            app/build/outputs/apk/release/tempo-${{ steps.version.outputs.version }}.apk \
            --clobber

      - name: Generate Play Store changelog
        run: ./scripts/generate-whatsnew.sh "${{ steps.version.outputs.version }}"

      - name: Validate changelog links are stripped
        run: |
          if grep -R -n -E 'https://github\.com/[^/]+/[^/]+/(issues|pull)/[0-9]+' build/whatsnew/; then
            echo "::error::Play Store changelog still contains GitHub issue/PR links."
            exit 1
          fi

      - name: Upload Play Store changelog
        uses: actions/upload-artifact@v7
        with:
          name: whatsnew-${{ steps.version.outputs.version }}
          path: build/whatsnew/
          retention-days: 90

  open-testing:
    name: 🧪 Open testing
    runs-on: ubuntu-latest
    needs: build
    environment: play-open-testing
    concurrency:
      group: publish-open-testing
      cancel-in-progress: false
    steps:
      - name: Download release AAB
        uses: actions/download-artifact@v8
        with:
          name: tempo-${{ needs.build.outputs.version }}.aab
          path: release

      - name: Download Play Store changelog
        uses: actions/download-artifact@v8
        with:
          name: whatsnew-${{ needs.build.outputs.version }}
          path: whatsnew

      - name: Publish to Google Play open testing
        # Pinned to a commit (v1.1.5): this third-party step is handed the Play service account key.
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.mandrecode.tempo
          releaseFiles: release/tempo-${{ needs.build.outputs.version }}.aab
          tracks: beta
          whatsNewDirectory: whatsnew

  production:
    name: 🚀 Production
    runs-on: ubuntu-latest
    needs: [build, open-testing]
    # play-production has a required reviewer: this job waits until the release is
    # approved (or rejected) in the run's page. Only the build still in open testing can be
    # promoted; approving an older release fails without changing anything.
    environment: play-production
    permissions:
      contents: read
      actions: read # reads the environment's protection rules
    concurrency:
      group: publish-production
      cancel-in-progress: false
    steps:
      # GitHub creates a missing environment on first use, without protection rules. Refuse to
      # ship rather than reach every user without the approval this job exists for.
      - name: Require approval on play-production
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REVIEWERS=$(gh api "repos/${{ github.repository }}/environments/play-production" \
            --jq '[.protection_rules[]? | select(.type == "required_reviewers")] | length')
          if [ "$REVIEWERS" = "0" ]; then
            echo "::error::play-production has no required reviewers. Add one (docs/implementation/play-release.md), then re-run this job."
            exit 1
          fi

      # The promotion script is tooling: take it from this workflow's commit, not the release
      # tag, so re-publishing an older tag still works.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/ci

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install Play API client
        run: pip install --disable-pip-version-check google-auth==2.40.3 requests==2.32.4

      - name: Promote open testing release to production
        env:
          PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/ci/promote-to-production.py com.mandrecode.tempo "${{ needs.build.outputs.version-code }}"
